spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:h2:mem:productservice_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      enabled: false

management:
  tracing:
    sampling:
      probability: 0.0
